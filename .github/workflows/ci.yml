name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm compile

      - name: Unit tests
        run: pnpm test

      - name: Release verifier regression tests
        run: node --test scripts/test-release-verifier.mjs

      # No .env in CI — the build must still succeed with missing keys.
      - name: Build extension
        run: pnpm build

      - name: Verify release package
        run: pnpm verify:release
