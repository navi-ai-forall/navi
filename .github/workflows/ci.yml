name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm compile

      - name: Unit tests
        run: pnpm test

      - name: Release verifier regression tests
        run: node --test scripts/test-release-verifier.mjs

      - name: Build and inspect the Store ZIP
        env:
          WXT_OPENAI_API_KEY: NAVI_PUBLIC_BUILD_NO_KEY
          WXT_RELEASE_VERSION: '1.0.0'
        run: |
          pnpm zip
          unzip -q .output/*-chrome.zip -d .output/store-verify
          pnpm verify:release .output/store-verify
